<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>鼓励贴生成器</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:#f5f7fa;padding:12px;}
.container{max-width:1200px;margin:0 auto;display:grid;grid-template-columns: 1fr 360px;gap:16px;}
@media (max-width:768px){.container{grid-template-columns:1fr;}}

/* 预览画布区域 */
.preview-wrap{position:relative;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px #00000018;}
#previewBox{position:relative;width:100%;aspect-ratio: 4/5;overflow:hidden;}
#bgImg{width:100%;height:100%;object-fit:contain;display:block;}
.text-item{position:absolute;cursor:move;white-space:pre-wrap;user-select:none;}

/* 右侧控制面板 */
.panel{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 12px #00000018;max-height:90vh;overflow:auto;}
h3{margin-bottom:12px;color:#333;}
.ctrl-group{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #eee;}
label{display:block;margin:6px 0 3px;font-size:14px;color:#444;}
input,select,textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;}
input[type="color"]{height:36px;padding:2px;}
.check-row{display:flex;gap:12px;margin:6px 0;}
textarea{min-height:80px;resize:vertical;}
.btn{width:100%;padding:10px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;margin-top:8px;}
.btn:hover{background:#2563eb;}
.bg-list{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
.bg-item{aspect-ratio:4/5;border:2px solid transparent;border-radius:4px;overflow:hidden;cursor:pointer;}
.bg-item.active{border-color:#3b82f6;}
.bg-item img{width:100%;height:100%;object-fit:cover;}
</style>
</head>
<body>
<div class="container">
  <!-- 预览区 -->
  <div class="preview-wrap">
    <div id="previewBox">
      <img id="bgImg" src="bg0.png" alt="底图">
      <!-- 四层文字：称呼、正文、落款、日期 -->
      <div class="text-item" data-type="call" id="textCall">亲爱的宝贝：</div>
      <div class="text-item" data-type="content" id="textContent">你今天真的很棒，坚持努力，看见你的闪光点❤️</div>
      <div class="text-item" data-type="sign" id="textSign">爱你的妈妈</div>
      <div class="text-item" data-type="date" id="textDate"></div>
    </div>
  </div>

  <!-- 控制面板 -->
  <div class="panel">
    <h3>底图选择</h3>
    <div class="ctrl-group">
      <div class="bg-list" id="bgList">
        <!-- 这里会JS自动渲染底图缩略图 -->
      </div>
    </div>

    <h3>称呼</h3>
    <div class="ctrl-group">
      <label>文字内容</label>
      <input id="inputCall" value="亲爱的宝贝：">
      <label>字体</label>
      <select id="fontCall">
        <option>SimSun</option><option>SimHei</option><option>Microsoft YaHei</option><option>KaiTi</option>
      </select>
      <label>字号</label>
      <input type="number" id="sizeCall" value="24">
      <label>字间距</label>
      <input type="number" id="letterCall" value="0">
      <label>文字颜色</label>
      <input type="color" id="colorCall" value="#000000">
      <div class="check-row">
        <label><input type="checkbox" id="boldCall"> 加粗</label>
        <label><input type="checkbox" id="italicCall"> 斜体</label>
      </div>
    </div>

    <h3>鼓励正文</h3>
    <div class="ctrl-group">
      <label>文字内容</label>
      <textarea id="inputContent">你今天真的很棒，坚持努力，看见你的闪光点❤️</textarea>
      <label>字体</label>
      <select id="fontContent">
        <option>SimSun</option><option>SimHei</option><option>Microsoft YaHei</option><option>KaiTi</option>
      </select>
      <label>字号</label>
      <input type="number" id="sizeContent" value="22">
      <label>字间距</label>
      <input type="number" id="letterContent" value="1">
      <label>行距</label>
      <input type="number" id="lineContent" value="1.6" step="0.1">
      <label>文字颜色</label>
      <input type="color" id="colorContent" value="#222222">
      <div class="check-row">
        <label><input type="checkbox" id="boldContent"> 加粗</label>
        <label><input type="checkbox" id="italicContent"> 斜体</label>
      </div>
    </div>

    <h3>落款</h3>
    <div class="ctrl-group">
      <label>文字内容</label>
      <input id="inputSign" value="爱你的妈妈">
      <label>字号</label>
      <input type="number" id="sizeSign" value="20">
      <label>文字颜色</label>
      <input type="color" id="colorSign" value="#000000">
      <div class="check-row">
        <label><input type="checkbox" id="boldSign"> 加粗</label>
        <label><input type="checkbox" id="italicSign"> 斜体</label>
      </div>
    </div>

    <h3>日期</h3>
    <div class="ctrl-group">
      <label>文字内容（默认今日）</label>
      <input id="inputDate">
      <label>字号</label>
      <input type="number" id="sizeDate" value="18">
      <label>文字颜色</label>
      <input type="color" id="colorDate" value="#000000">
      <div class="check-row">
        <label><input type="checkbox" id="boldDate"> 加粗</label>
        <label><input type="checkbox" id="italicDate"> 斜体</label>
      </div>
    </div>
    <button class="btn" id="downloadBtn">下载鼓励贴图片</button>
  </div>
</div>

<script>
// ========= 底图文件名：bg0 ~ bg20，顺序不变 =========
const bgFiles = [
  "bg0.png",
  "bg1.png",
  "bg2.png",
  "bg3.png",
  "bg4.png",
  "bg5.png",
  "bg6.jpeg",
  "bg7.png",
  "bg8.png",
  "bg9.png",
  "bg10.png",
  "bg11.png",
  "bg12.png",
  "bg13.png",
  "bg14.png",
  "bg15.png",
  "bg16.png",
  "bg17.png",
  "bg18.png",
  "bg19.png",
  "bg20.png"
];

// 获取当天日期，格式 YYYY.MM.DD
function getTodayDate(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}.${m}.${day}`;
}
const todayStr = getTodayDate();
// ==============================================

const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);
const previewBox = $("#previewBox");
const bgImg = $("#bgImg");
const bgListWrap = $("#bgList");

// 初始化日期
$("#inputDate").value = todayStr;
$("#textDate").innerText = todayStr;

// 渲染底图缩略选择列表
bgFiles.forEach((src,idx)=>{
  const div = document.createElement("div");
  div.className = "bg-item"+(idx===0?" active":"");
  div.innerHTML = `<img src="${src}" alt="">`;
  div.onclick = ()=>{
    bgImg.src = src;
    $$(".bg-item").forEach(i=>i.classList.remove("active"));
    div.classList.add("active");
  }
  bgListWrap.appendChild(div);
})

// 文字元素
const els = {
  call: $("#textCall"),
  content: $("#textContent"),
  sign: $("#textSign"),
  date: $("#textDate")
};
const inputs = {
  call: $("#inputCall"),
  content: $("#inputContent"),
  sign: $("#inputSign"),
  date: $("#inputDate")
};

// 双向绑定文字：输入框修改同步预览
inputs.call.oninput = ()=>els.call.innerText = inputs.call.value;
inputs.content.oninput = ()=>els.content.innerText = inputs.content.value;
inputs.sign.oninput = ()=>els.sign.innerText = inputs.sign.value;
inputs.date.oninput = ()=>els.date.innerText = inputs.date.value;

// 拖拽移动文字
let dragTarget = null, offsetX=0, offsetY=0;
$$(".text-item").forEach(el=>{
  el.onmousedown = (e)=>{
    dragTarget = el;
    const rect = el.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    e.preventDefault();
  }
})
document.onmousemove = (e)=>{
  if(!dragTarget) return;
  const boxRect = previewBox.getBoundingClientRect();
  const x = e.clientX - boxRect.left - offsetX;
  const y = e.clientY - boxRect.top - offsetY;
  dragTarget.style.left = x + "px";
  dragTarget.style.top = y + "px";
}
document.onmouseup = ()=>dragTarget=null;
// 手机触摸拖拽
$$(".text-item").forEach(el=>{
  el.ontouchstart = (e)=>{
    dragTarget = el;
    const t = e.touches[0];
    const rect = el.getBoundingClientRect();
    offsetX = t.clientX - rect.left;
    offsetY = t.clientY - rect.top;
  }
})
document.ontouchmove = (e)=>{
  if(!dragTarget) return;
  const t = e.touches[0];
  const boxRect = previewBox.getBoundingClientRect();
  const x = t.clientX - boxRect.left - offsetX;
  const y = t.clientY - boxRect.top - offsetY;
  dragTarget.style.left = x + "px";
  dragTarget.style.top = y + "px";
}
document.ontouchend = ()=>dragTarget=null;

// ===== 称呼样式绑定 =====
$("#sizeCall").oninput = ()=>els.call.style.fontSize = $("#sizeCall").value+"px";
$("#fontCall").oninput = ()=>els.call.style.fontFamily = $("#fontCall").value;
$("#letterCall").oninput = ()=>els.call.style.letterSpacing = $("#letterCall").value+"px";
$("#colorCall").oninput = ()=>els.call.style.color = $("#colorCall").value;
$("#boldCall").onchange = ()=>els.call.style.fontWeight = $("#boldCall").checked ? "bold":"normal";
$("#italicCall").onchange = ()=>els.call.style.fontStyle = $("#italicCall").checked ? "italic":"normal";

// ===== 正文样式绑定 =====
$("#sizeContent").oninput = ()=>els.content.style.fontSize = $("#sizeContent").value+"px";
$("#fontContent").oninput = ()=>els.content.style.fontFamily = $("#fontContent").value;
$("#letterContent").oninput = ()=>els.content.style.letterSpacing = $("#letterContent").value+"px";
$("#lineContent").oninput = ()=>els.content.style.lineHeight = $("#lineContent").value;
$("#colorContent").oninput = ()=>els.content.style.color = $("#colorContent").value;
$("#boldContent").onchange = ()=>els.content.style.fontWeight = $("#boldContent").checked ? "bold":"normal";
$("#italicContent").onchange = ()=>els.content.style.fontStyle = $("#italicContent").checked ? "italic":"normal";

// ===== 落款样式绑定 =====
$("#sizeSign").oninput = ()=>els.sign.style.fontSize = $("#sizeSign").value+"px";
$("#colorSign").oninput = ()=>els.sign.style.color = $("#colorSign").value;
$("#boldSign").onchange = ()=>els.sign.style.fontWeight = $("#boldSign").checked ? "bold":"normal";
$("#italicSign").onchange = ()=>els.sign.style.fontStyle = $("#italicSign").checked ? "italic":"normal";

// ===== 日期样式绑定 =====
$("#sizeDate").oninput = ()=>els.date.style.fontSize = $("#sizeDate").value+"px";
$("#colorDate").oninput = ()=>els.date.style.color = $("#colorDate").value;
$("#boldDate").onchange = ()=>els.date.style.fontWeight = $("#boldDate").checked ? "bold":"normal";
$("#italicDate").onchange = ()=>els.date.style.fontStyle = $("#italicDate").checked ? "italic":"normal";

// 下载图片
$("#downloadBtn").onclick = async ()=>{
  $("#downloadBtn").innerText="生成中...";
  const canvas = await html2canvas(previewBox,{
    useCORS:true,
    scale:2, // 图片清晰度，2=高清
    backgroundColor:null
  })
  const link = document.createElement("a");
  link.download = "鼓励贴_"+Date.now()+".png";
  link.href = canvas.toDataURL("image/png");
  link.click();
  $("#downloadBtn").innerText="下载鼓励贴图片";
}
</script>
</body>
</html>
