<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鼓励贴生成器 · 可拖可缩放文本框</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #e9e9e9;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  .toolbar {
    width: 56vw;
    padding: 10px 14px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
  }
  .toolbar select, .toolbar input[type=number], .toolbar input[type=text], .toolbar button, .toolbar label {
    font-size: 13px;
    padding: 4px 6px;
    border: 1px solid #bbb;
    border-radius: 4px;
    background: #fff;
  }
  .toolbar button {
    cursor: pointer;
    background: #f5f5f5;
  }
  .toolbar button.primary {
    background: #2f80ed;
    color: white;
    border-color: #2f80ed;
  }
  .toolbar button.danger {
    background: #e35b5b;
    color: white;
    border-color: #e35b5b;
  }
  .workspace {
    flex: 1;
    margin-top: 52px;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
  }
  .stage {
    position: relative;
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
    background: #fff;
  }
  canvas {
    display: block;
    user-select: none;
    touch-action: none;
  }
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .25s;
    z-index: 50;
    pointer-events: none;
  }
  #toast.show { opacity: .92; }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
  }
  .modal.active { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 10px;
    padding: 18px 20px;
    width: 360px;
    max-width: 92vw;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .modal-box textarea {
    width: 100%;
    min-height: 110px;
    font-size: 14px;
    padding: 8px;
    border: 1px solid #bbb;
    border-radius: 6px;
    resize: vertical;
  }
  .modal-box input {
    width: 100%;
    font-size: 14px;
    padding: 7px;
    border: 1px solid #bbb;
    border-radius: 6px;
    margin-top: 6px;
  }
  .modal-box .row { margin-bottom: 10px; }
  .modal-box button {
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid #bbb;
    background: #f5f5f5;
    cursor: pointer;
  }
  .modal-box button.primary { background: #2f80ed; color: #fff; border-color: #2f80ed; }
  .hint { color:#777; font-size:12px; }
</style>
</head>
<body>

<div class="toolbar">
  <select id="fontFamily">
    <option>微软雅黑</option>
    <option>宋体</option>
    <option>楷体</option>
    <option>黑体</option>
    <option>仓耳舒圆</option>
    <option>Arial</option>
  </select>

  <select id="fontSize">
    <!-- 范围加大 -->
    <option>20</option><option>22</option><option>24</option><option>25</option>
    <option>28</option><option>32</option><option>36</option><option>40</option>
    <option selected>45</option><option>50</option><option>56</option><option>64</option>
    <option>72</option><option>80</option><option>88</option><option>96</option>
  </select>

  <input type="color" id="fontColor" value="#222222">

  <select id="align">
    <option value="left" selected>左对齐</option>
    <option value="center">居中</option>
    <option value="right">右对齐</option>
  </select>

  <input type="number" id="lineHeight" value="1.55" step="0.05" min="1" max="3" style="width:58px">

  <select id="fontWeight">
    <option value="normal" selected>普通</option>
    <option value="bold">加粗</option>
  </select>

  <label><input type="checkbox" id="showSignature" checked> 落款</label>

  <select id="sigFontSize">
    <option value="same" selected>同正文</option>
    <option>20</option><option>22</option><option>24</option><option>28</option>
    <option>32</option><option>36</option><option>40</option><option>48</option>
    <option>56</option><option>64</option>
  </select>

  <label><input type="checkbox" id="autoFitText"> 正文自动适配框</label>

  <button id="editBtn">编辑文字</button>
  <button id="previewBtn">预览</button>
  <button id="genBtn" class="primary">生成图片</button>
  <button id="resetBoxBtn" title="恢复默认文本框位置和大小">重置文本区</button>
  <span class="hint">拖框移动，拖右下角圆点调大小</span>
</div>

<div class="workspace">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
  </div>
</div>

<div id="toast"></div>

<div class="modal" id="textModal">
  <div class="modal-box">
    <div class="row">
      <div>正文（可换行）</div>
      <textarea id="editTextZh"></textarea>
    </div>
    <div class="row">
      <div>落款名称</div>
      <input id="editSigText" type="text" placeholder="永远爱你的老婆">
    </div>
    <div class="row">
      <div>日期</div>
      <input id="editSigDate" type="text" placeholder="2026.8.30">
    </div>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button onclick="closeTextEditor()">取消</button>
      <button class="primary" onclick="confirmText()">确定</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

const ui = {
  fontFamily: document.getElementById('fontFamily'),
  fontSize: document.getElementById('fontSize'),
  fontColor: document.getElementById('fontColor'),
  align: document.getElementById('align'),
  lineHeight: document.getElementById('lineHeight'),
  fontWeight: document.getElementById('fontWeight'),
  showSignature: document.getElementById('showSignature'),
  sigFontSize: document.getElementById('sigFontSize'),
  autoFitText: document.getElementById('autoFitText'),
  editBtn: document.getElementById('editBtn'),
  previewBtn: document.getElementById('previewBtn'),
  genBtn: document.getElementById('genBtn'),
  resetBoxBtn: document.getElementById('resetBoxBtn'),
};

let bgImage = null;
let previewMode = false;

let userTextZh = '亲爱的老公：\n刚跟你说家里鸡蛋需要补货，你立刻就安排妥当，后天就能收到。这份把家里小事放在心上、事事快速响应的模样，满满的都是对家的用心，也带给我十足的安全感❤️\n谢谢老公贴心投喂，烟火日常里，有你真好。';
let userSigText = '永远爱你的老婆';
let userSigDate = '2026.8.30';

// 逻辑画布尺寸（导出尺寸也用这个）
const LOGICAL_W = 720;
const LOGICAL_H = 960;

canvas.width = LOGICAL_W;
canvas.height = LOGICAL_H;

let textBox = defaultTextBox();
let sigBox = defaultSigBox();

let drag = null;
// { type:'move'|'resize', target:'text'|'sig', startX, startY, orig }

function defaultTextBox() {
  return {
    x: Math.round(LOGICAL_W * 0.16),
    y: Math.round(LOGICAL_H * 0.16),
    w: Math.round(LOGICAL_W * 0.66),
    h: Math.round(LOGICAL_H * 0.42),
  };
}
function defaultSigBox() {
  return {
    x: Math.round(LOGICAL_W * 0.30),
    y: Math.round(LOGICAL_H * 0.66),
    w: Math.round(LOGICAL_W * 0.26),
    h: Math.round(LOGICAL_H * 0.07),
  };
}

// 背景图：用相对路径 images/1.png，和之前保持一致
function loadDefaultBg() {
  bgImage = new Image();
  bgImage.crossOrigin = 'anonymous';
  bgImage.src = 'images/1.png';
  bgImage.onload = redraw;
  bgImage.onerror = () => {
    showToast('未找到 images/1.png，请确认图片路径');
    redraw();
  };
}

function getState() {
  return {
    ff: ui.fontFamily.value,
    fs: parseInt(ui.fontSize.value, 10) || 45,
    fc: ui.fontColor.value,
    ta: ui.align.value,
    lh: parseFloat(ui.lineHeight.value) || 1.55,
    fw: ui.fontWeight.value,
    showSig: ui.showSignature.checked,
    sigMode: ui.sigFontSize.value,
    autoFit: ui.autoFitText.checked,
  };
}

function resolveSigFontSize(s, bodyFs) {
  if (s.sigMode === 'same') return bodyFs;
  return parseInt(s.sigMode, 10) || 28;
}

function fontStr(s, fs) {
  return `${s.fw} ${fs}px ${s.ff}`;
}

function wrapLines(c, text, maxWidth) {
  const manual = text.split('\n');
  const out = [];
  for (const para of manual) {
    if (!para) { out.push(''); continue; }
    let cur = '';
    for (const ch of para) {
      const test = cur + ch;
      if (c.measureText(test).width > maxWidth && cur) {
        out.push(cur);
        cur = ch;
      } else {
        cur = test;
      }
    }
    if (cur) out.push(cur);
  }
  return out;
}

// 自动找合适字号：让正文文本块尽量放进 textBox，最大不超过当前选择字号/96
function autoFitFontSize(s, box, text) {
  const c = ctx;
  const maxFs = Math.min(s.fs, 96);
  const minFs = 20;
  const padX = 20; // 框内左右留白，和绘制一致
  const padY = 16;
  const maxW = box.w - padX;
  const maxH = box.h - padY;
  let best = minFs;

  // 二分
  let lo = minFs, hi = maxFs;
  while (lo <= hi) {
    const mid = Math.round((lo + hi) / 2);
    c.font = fontStr(s, mid);
    const lines = wrapLines(c, text || '', maxW);
    const lineH = mid * s.lh;
    const needH = lines.length * lineH;
    // 宽度检查：最长行
    let okW = true;
    for (const ln of lines) {
      if (c.measureText(ln).width > maxW) { okW = false; break; }
    }
    if (okW && needH <= maxH) {
      best = mid;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }
  return best;
}

function drawTextContent(c, s, forExport = false) {
  // 背景
  if (bgImage) {
    c.drawImage(bgImage, 0, 0, LOGICAL_W, LOGICAL_H);
  } else {
    c.fillStyle = '#f6fff8';
    c.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }

  let bodyFs = s.fs;
  if (s.autoFit && (userTextZh || '').trim()) {
    bodyFs = autoFitFontSize(s, textBox, userTextZh);
  }

  c.font = fontStr(s, bodyFs);
  c.fillStyle = s.fc;
  c.textAlign = s.ta;
  c.textBaseline = 'top';

  const padX = 20;
  const maxW = textBox.w - padX;
  const lines = wrapLines(c, userTextZh || '', maxW);
  const lineH = bodyFs * s.lh;
  const startY = textBox.y + 8;

  lines.forEach((line, i) => {
    const x = s.ta === 'center' ? textBox.x + textBox.w/2
            : s.ta === 'right' ? textBox.x + textBox.w - 10
            : textBox.x + 10;
    c.fillText(line, x, startY + i * lineH);
  });

  if (s.showSig) {
    const sigFs = resolveSigFontSize(s, bodyFs);
    c.font = fontStr(s, sigFs);
    c.fillStyle = '#666';
    c.textAlign = s.ta;
    c.textBaseline = 'top';

    const sigLines = [];
    if (userSigText) sigLines.push(userSigText);
    if (userSigDate) sigLines.push(userSigDate);

    const slh = sigFs * 1.45;
    sigLines.forEach((line, i) => {
      const x = s.ta === 'center' ? sigBox.x + sigBox.w/2
              : s.ta === 'right' ? sigBox.x + sigBox.w - 10
              : sigBox.x + 10;
      c.fillText(line, x, sigBox.y + 8 + i * slh);
    });
  }

  if (!forExport && !previewMode) {
    drawBoxHandles(c, textBox, '#2f80ed');
    drawBoxHandles(c, sigBox, '#e35b5b');
  }
}

function drawBoxHandles(c, box, color) {
  c.save();
  c.strokeStyle = color;
  c.setLineDash([6, 4]);
  c.lineWidth = 1.5;
  c.strokeRect(box.x + 0.5, box.y + 0.5, box.w - 1, box.h - 1);
  c.setLineDash([]);
  // 右下角调整手柄
  const hs = 8;
  c.fillStyle = color;
  c.beginPath();
  c.arc(box.x + box.w, box.y + box.h, hs/2, 0, Math.PI*2);
  c.fill();
  // 四角小点，视觉提示
  const pts = [
    [box.x, box.y],
    [box.x + box.w, box.y],
    [box.x, box.y + box.h],
  ];
  for (const [px,py] of pts) {
    c.beginPath();
    c.arc(px, py, 3.2, 0, Math.PI*2);
    c.fill();
  }
  c.restore();
}

function redraw() {
  const s = getState();
  // 编辑画布就是逻辑尺寸，CSS缩放显示，所以坐标完全一致
  ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
  drawTextContent(ctx, s, false);
  fitStageScale();
}

function fitStageScale() {
  const maxW = Math.max(320, window.innerWidth - 40);
  const maxH = window.innerHeight - 80;
  const scale = Math.min(maxW / LOGICAL_W, maxH / LOGICAL_H, 1);
  stage.style.width = (LOGICAL_W * scale) + 'px';
  stage.style.height = (LOGICAL_H * scale) + 'px';
  canvas.style.width = (LOGICAL_W * scale) + 'px';
  canvas.style.height = (LOGICAL_H * scale) + 'px';
}

// ---- 交互：拖移/缩放 ----
function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  return {
    x: cx * (LOGICAL_W / rect.width),
    y: cy * (LOGICAL_H / rect.height),
  };
}

function hitHandle(box, px, py) {
  const r = 10;
  // 右下角优先
  if (Math.hypot(px - (box.x + box.w), py - (box.y + box.h)) <= r) return 'resize';
  if (px >= box.x && px <= box.x + box.w && py >= box.y && py <= box.y + box.h) return 'move';
  return null;
}

function onDown(e) {
  if (previewMode) return;
  e.preventDefault();
  const p = getMousePos(e);
  const sigHit = ui.showSignature.checked ? hitHandle(sigBox, p.x, p.y) : null;
  const txtHit = hitHandle(textBox, p.x, p.y);

  if (sigHit) {
    drag = {
      target: 'sig',
      action: sigHit,
      startX: p.x, startY: p.y,
      orig: { ...sigBox }
    };
  } else if (txtHit) {
    drag = {
      target: 'text',
      action: txtHit,
      startX: p.x, startY: p.y,
      orig: { ...textBox }
    };
  }
}
function onMove(e) {
  if (!drag) return;
  e.preventDefault();
  const p = getMousePos(e);
  const dx = p.x - drag.startX;
  const dy = p.y - drag.startY;
  const target = drag.target === 'sig' ? sigBox : textBox;
  if (drag.action === 'move') {
    target.x = clamp(drag.orig.x + dx, 0, LOGICAL_W - target.w);
    target.y = clamp(drag.orig.y + dy, 0, LOGICAL_H - target.h);
  } else if (drag.action === 'resize') {
    const nw = clamp(drag.orig.w + dx, 80, LOGICAL_W - target.x);
    const nh = clamp(drag.orig.h + dy, 40, LOGICAL_H - target.y);
    target.w = nw;
    target.h = nh;
  }
  redraw();
}
function onUp() { drag = null; }

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', e => { if(drag) onMove(e); });
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchmove', e => { if(drag) onMove(e); }, {passive:false});
window.addEventListener('touchend', onUp);

function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

// ---- 按钮 ----
ui.editBtn.onclick = openTextEditor;
ui.previewBtn.onclick = () => {
  previewMode = !previewMode;
  ui.previewBtn.style.background = previewMode ? '#2f80ed' : '#f5f5f5';
  ui.previewBtn.style.color = previewMode ? '#fff' : '#000';
  redraw();
};
ui.genBtn.onclick = generateImage;
ui.resetBoxBtn.onclick = () => {
  textBox = defaultTextBox();
  sigBox = defaultSigBox();
  redraw();
  showToast('已重置文本区');
};

ui.fontFamily.onchange=ui.fontSize.onchange=ui.fontColor.onchange=ui.align.onchange=ui.lineHeight.onchange=ui.fontWeight.onchange=ui.showSignature.onchange=ui.sigFontSize.onchange=ui.autoFitText.onchange = redraw;

function openTextEditor(){
  document.getElementById('editTextZh').value = userTextZh;
  document.getElementById('editSigText').value = userSigText;
  document.getElementById('editSigDate').value = userSigDate;
  document.getElementById('textModal').classList.add('active');
  setTimeout(()=>document.getElementById('editTextZh').focus(),100);
}
function closeTextEditor(){ document.getElementById('textModal').classList.remove('active'); }
function confirmText(){
  userTextZh = document.getElementById('editTextZh').value;
  userSigText = document.getElementById('editSigText').value;
  userSigDate = document.getElementById('editSigDate').value;
  closeTextEditor();
  redraw();
  showToast('文字已更新');
}

function generateImage(){
  if (!bgImage) {
    showToast('背景图未加载完成');
  }
  const out = document.createElement('canvas');
  out.width = LOGICAL_W;
  out.height = LOGICAL_H;
  const octx = out.getContext('2d');
  const s = getState();
  // 关键：导出和编辑共用同一绘制逻辑，坐标系统一致
  drawTextContent(octx, s, true);

  const link = document.createElement('a');
  link.download = `鼓励贴_${Date.now()}.png`;
  link.href = out.toDataURL('image/png');
  link.click();
  showToast('图片已生成并下载');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

window.addEventListener('resize', fitStageScale);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { previewMode=false; redraw(); }
});

loadDefaultBg();
</script>
</body>
</html>
