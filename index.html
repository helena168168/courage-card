<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鼓励贴生成器</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Microsoft YaHei','仓耳舒圆',sans-serif;background:#f0f2f5;display:flex;height:100vh;overflow:hidden;}

  /* ===== 左侧模板栏 ===== */
  .sidebar{width:240px;min-width:240px;background:#fff;border-right:1px solid #e8e8e8;display:flex;flex-direction:column;}
  .logo{padding:16px 14px;font-size:16px;font-weight:bold;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:8px;}
  .logo svg{width:22px;height:22px;color:#4a90d9;}
  .steps{padding:10px 14px;font-size:12px;color:#999;border-bottom:1px solid #f0f0f0;line-height:1.8;}
  .template-list{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .template-item{border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;transition:all .2s;background:#fafafa;}
  .template-item img{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;}
  .template-item span{display:block;font-size:10px;text-align:center;padding:4px 2px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .template-item:hover{border-color:#4a90d9;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1);}
  .template-item.active{border-color:#ff6b6b;box-shadow:0 0 8px rgba(255,107,107,.4);}

  /* ===== 主区域 ===== */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

  /* 工具栏 */
  .toolbar{background:#fff;padding:10px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e8e8e8;flex-wrap:wrap;}
  .toolbar label{font-size:12px;color:#666;white-space:nowrap;}
  .toolbar select,.toolbar input[type=color]{padding:5px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;outline:none;height:30px;}
  .toolbar input[type=color]{width:34px;padding:2px;cursor:pointer;}
  .toolbar-group{display:flex;align-items:center;gap:6px;padding:0 8px;border-right:1px solid #eee;height:34px;}
  .toolbar-group:last-child{border-right:none;margin-left:auto;}
  .btn{padding:6px 16px;border-radius:5px;cursor:pointer;font-size:13px;border:none;color:#fff;display:flex;align-items:center;gap:4px;height:30px;transition:all .2s;}
  .btn-edit{background:#ff6b6b;}
  .btn-edit:hover{background:#ee5a5a;}
  .btn-preview{background:#fff;border:1px solid #4a90d9;color:#4a90d9;}
  .btn-preview:hover{background:#f0f7ff;}
  .btn-generate{background:#4a90d9;}
  .btn-generate:hover{background:#3a7bc8;}

  /* 画布区 */
  .canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#e0e0e0;position:relative;overflow:hidden;}
  #canvasWrap{position:relative;}
  canvas{cursor:default;box-shadow:0 8px 32px rgba(0,0,0,.15);border-radius:4px;}

  /* 预览条 */
  #previewBar{position:fixed;top:0;left:240px;right:0;background:#4a90d9;color:#fff;text-align:center;padding:8px;z-index:100;transform:translateY(-100%);transition:transform .3s;font-size:14px;}
  #previewBar.active{transform:translateY(0);}
  #previewBar button{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:10px;}

  /* Toast */
  #toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.75);color:#fff;padding:10px 24px;border-radius:20px;opacity:0;transition:all .3s;z-index:200;font-size:14px;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 错误提示 */
  .error-box{position:fixed;bottom:40px;left:20px;background:#d93025;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:999;max-width:400px;display:none;}
  .error-box.show{display:block;}

  /* ===== 模态框 ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:300;}
  .modal-overlay.active{display:flex;}
  .modal-box{background:#fff;border-radius:12px;padding:24px;width:440px;max-width:92vw;box-shadow:0 12px 48px rgba(0,0,0,.2);}
  .modal-title{font-size:17px;font-weight:bold;margin-bottom:18px;display:flex;align-items:center;gap:8px;color:#333;}
  .modal-group{margin-bottom:16px;}
  .modal-group label{display:block;font-size:13px;margin-bottom:6px;color:#444;font-weight:500;}
  .modal-group textarea{width:100%;padding:10px 12px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;resize:vertical;min-height:90px;font-family:inherit;line-height:1.6;outline:none;transition:border .2s;}
  .modal-group textarea:focus{border-color:#4a90d9;box-shadow:0 0 0 2px rgba(74,144,217,.15);}
  .modal-group input[type=text]{width:100%;padding:10px 12px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;outline:none;transition:border .2s;}
  .modal-group input[type=text]:focus{border-color:#4a90d9;box-shadow:0 0 0 2px rgba(74,144,217,.15);}
  .hint-text{font-size:12px;color:#999;margin-top:4px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .btn-cancel{padding:8px 22px;border:1px solid #d9d9d9;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;color:#666;}
  .btn-cancel:hover{background:#f5f5f5;}
  .btn-confirm{padding:8px 22px;background:#4a90d9;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;}
  .btn-confirm:hover{background:#3a7bc8;}

  /* ===== 响应式 ===== */
  @media (max-width:768px){
    .sidebar{width:100px;min-width:100px;}
    .logo{font-size:12px;padding:10px 6px;}
    .steps{display:none;}
    .template-list{grid-template-columns:1fr;gap:6px;padding:8px;}
    .template-item span{font-size:9px;}
    .toolbar{padding:6px 10px;gap:6px;}
    .toolbar-group{height:28px;padding:0 4px;}
    .toolbar select,.toolbar input[type=color]{height:26px;font-size:12px;padding:2px 4px;}
    .btn{height:26px;padding:4px 10px;font-size:12px;}
  }
</style>
</head>
<body>

<!-- ===== 左侧栏 ===== -->
<div class="sidebar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    鼓励贴生成器
  </div>
  <div class="steps">
    ① 选择模板<br>
    ② 编辑文字<br>
    ③ 一键生成
  </div>
  <div class="template-list" id="templateList"></div>
</div>

<!-- ===== 主区域 ===== -->
<div class="main">
  <!-- 预览条 -->
  <div id="previewBar">
    👁 预览模式 — 文字已锁定
    <button onclick="exitPreview()">退出预览</button>
    <button onclick="generateImage()">💾 保存图片</button>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <div class="toolbar-group">
      <label>字体</label>
      <select id="fontFamily">
        <option value="Microsoft YaHei">微软雅黑</option>
        <option value="SimHei">黑体</option>
        <option value="KaiTi">楷体</option>
        <option value="SimSun">宋体</option>
        <option value="FangSong">仿宋</option>
        <option value="STXingkai">华文行楷</option>
        <option value="仓耳舒圆">仓耳舒圆</option>
        <option value="Arial">Arial</option>
      </select>
    </div>
    <div class="toolbar-group">
      <label>字号</label>
      <select id="fontSize">
        <option value="14">14px</option>
        <option value="16">16px</option>
        <option value="18">18px</option>
        <option value="20" selected>20px</option>
        <option value="22">22px</option>
        <option value="24">24px</option>
        <option value="28">28px</option>
        <option value="32">32px</option>
        <option value="36">36px</option>
      </select>
    </div>
    <div class="toolbar-group">
      <label>颜色</label>
      <input type="color" id="fontColor" value="#333333">
    </div>
    <div class="toolbar-group">
      <label>对齐</label>
      <select id="textAlign">
        <option value="left">左对齐</option>
        <option value="center" selected>居中</option>
        <option value="right">右对齐</option>
      </select>
    </div>
    <div class="toolbar-group">
      <label>行高</label>
      <input type="number" id="lineHeight" value="1.6" min="1" max="3" step="0.1" style="width:50px;height:28px;border:1px solid #ddd;border-radius:4px;padding:0 4px;font-size:13px;">
    </div>
    <div class="toolbar-group">
      <label>加粗</label>
      <select id="fontWeight">
        <option value="normal" selected>普通</option>
        <option value="bold">加粗</option>
      </select>
    </div>
    <div class="toolbar-group">
      <label>落款字号</label>
      <select id="sigFontSize">
        <option value="same" selected>同正文</option>
        <option value="12">12px</option>
        <option value="14">14px</option>
        <option value="16">16px</option>
        <option value="18">18px</option>
        <option value="20">20px</option>
        <option value="24">24px</option>
      </select>
    </div>
    <div class="toolbar-group">
      <label style="cursor:pointer;"><input type="checkbox" id="showSignature" checked style="margin-right:4px;">显示落款</label>
    </div>
    <div class="toolbar-group">
      <button class="btn btn-edit" onclick="openTextEditor()">✏️ 编辑文字</button>
      <button class="btn btn-preview" onclick="togglePreview()">👁 预览</button>
      <button class="btn btn-generate" onclick="generateImage()">💾 生成图片</button>
    </div>
  </div>

  <!-- 画布 -->
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="canvas"></canvas>
  </div>
</div>

<!-- ===== 编辑文字弹窗 ===== -->
<div class="modal-overlay" id="textModal">
  <div class="modal-box">
    <div class="modal-title">✏️ 编辑文字内容</div>

    <div class="modal-group">
      <label for="editTextZh">📝 正文内容（支持换行，按回车即可）</label>
      <textarea id="editTextZh" placeholder="亲爱的XXX：&#10;&#10;每一次尝试都有光芒&#10;慢慢走，也能到达"></textarea>
      <div class="hint-text">💡 提示：在输入框中按回车键换行，图片上会同步换行显示。</div>
    </div>

    <div class="modal-group">
      <label for="editSigText">✍️ 落款文字</label>
      <input type="text" id="editSigText" placeholder="永远爱你的妈妈">
    </div>

    <div class="modal-group">
      <label for="editSigDate">📅 落款日期</label>
      <input type="text" id="editSigDate">
      <div class="hint-text">格式示例：2026.08.20（默认自动填充当天日期）</div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeTextEditor()">取消</button>
      <button class="btn-confirm" onclick="confirmText()">确认</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div class="error-box" id="errorBox"></div>

<script>
// ============ 自动探测 base path ============
function getBasePath(){
  const p = window.location.pathname;
  const m = p.match(/^(\/[^/]+\/)/);
  return m ? m[1] : '/';
}
const BASE = getBasePath();

// ============ 模板数据 ============
const TEMPLATES = [
  {"id":"01_wizard_green","name":"绿色星空小巫师","file":BASE+"images/01_wizard_green.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":603,"h":748}},
  {"id":"02_wizard_warm","name":"暖黄魔法小巫师","file":BASE+"images/02_wizard_warm.png","width":1600,"height":2848,"avoidArea":{"x":6,"y":2083,"w":608,"h":609}},
  {"id":"03_wizard_pink","name":"粉色樱花小巫师","file":BASE+"images/03_wizard_pink.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":615,"h":748}},
  {"id":"04_wizard_blue","name":"蓝天雨滴小巫师","file":BASE+"images/04_wizard_blue.png","width":1600,"height":2848,"avoidArea":{"x":36,"y":2083,"w":578,"h":600}},
  {"id":"05_wizard_warm_orange","name":"暖橙阳光小巫师","file":BASE+"images/05_wizard_warm_orange.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":395,"h":573}},
  {"id":"06_wizard_purple","name":"梦幻紫色小巫师","file":BASE+"images/06_wizard_purple.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":615,"h":765}},
  {"id":"07_wizard_gold","name":"金色荣耀小巫师","file":BASE+"images/07_wizard_gold.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":615,"h":765}},
  {"id":"08_wizard_teal","name":"青绿海洋小巫师","file":BASE+"images/08_wizard_teal.png","width":1600,"height":2848,"avoidArea":{"x":46,"y":2083,"w":568,"h":550}},
  {"id":"09_wizard_dreamy","name":"梦幻紫粉小巫师","file":BASE+"images/09_wizard_dreamy.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":615,"h":763}},
  {"id":"10_wizard_pink_love","name":"粉色爱心小巫师","file":BASE+"images/10_wizard_pink_love.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":593,"h":738}},
  {"id":"11_basketball_blue","name":"蓝天篮球小勇士","file":BASE+"images/11_basketball_blue.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":615,"h":587}},
  {"id":"12_wizard_pink_frame","name":"粉色边框小巫师","file":BASE+"images/12_wizard_pink_frame.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":593,"h":738}},
  {"id":"13_wizard_red_gold","name":"红金庆典小巫师","file":BASE+"images/13_wizard_red_gold.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":615,"h":765}},
  {"id":"14_wizard_certificate","name":"金色奖状小巫师","file":BASE+"images/14_wizard_certificate.png","width":1600,"height":2848,"avoidArea":{"x":0,"y":2083,"w":614,"h":765}},
  {"id":"15_wizard_light_blue","name":"浅蓝思考小巫师","file":BASE+"images/15_wizard_light_blue.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":610,"h":748}},
  {"id":"16_wizard_rain","name":"雨滴探索小巫师","file":BASE+"images/16_wizard_rain.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":615,"h":748}},
  {"id":"17_basketball_blue_sky","name":"蓝天白云小球员","file":BASE+"images/17_basketball_blue_sky.png","width":1600,"height":2848,"avoidArea":{"x":0,"y":2083,"w":614,"h":641}},
  {"id":"18_basketball_gold","name":"金色荣耀小球员","file":BASE+"images/18_basketball_gold.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":615,"h":765}},
  {"id":"19_basketball_green","name":"绿色成长小球员","file":BASE+"images/19_basketball_green.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":615,"h":622}},
  {"id":"20_basketball_pink","name":"粉色甜蜜小球员","file":BASE+"images/20_basketball_pink.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":584,"h":658}},
  {"id":"21_note_blue_stars","name":"蓝色星空便签","file":BASE+"images/21_note_blue_stars.png","width":562,"height":1000},
  {"id":"22_basketball_red_warm","name":"红火热情小球员","file":BASE+"images/22_basketball_red_warm.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":615,"h":765}},
  {"id":"23_basketball_yellow","name":"暖黄收获小球员","file":BASE+"images/23_basketball_yellow.png","width":1600,"height":2848,"avoidArea":{"x":985,"y":2083,"w":615,"h":614}},
  {"id":"24_romantic_pink","name":"粉色浪漫爱心","file":BASE+"images/24_romantic_pink.png","width":562,"height":1000}
];

// ============ 全局状态 ============
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
let currentTemplate = null;
let bgImage = null;
let previewMode = false;

// 画布显示参数
const MAX_W = 500;
const MAX_H = 700;

// 文本框（基于模板原始坐标）
let textBox = {x:80, y:200, w:440, h:400};
// 落款框（基于模板原始坐标）
let sigBox = {x:350, y:2400, w:220, h:70};

// 用户文字
let userTextZh = '';
let userSigText = '永远爱你的妈妈';
let userSigDate = '';

// 拖拽状态
let dragTarget = null; // 'text' | 'sig' | null
let dragOffsetX = 0, dragOffsetY = 0;
let resizeTarget = null; // 'text' | 'sig' | null
let resizeCorner = '';
let dragStartX = 0, dragStartY = 0;

// ============ 初始化 ============
function init(){
  renderTemplates();
  if(TEMPLATES.length > 0) selectTemplate(TEMPLATES[0]);
  setupCanvasEvents();
  setupToolbarEvents();
  // 默认日期
  userSigDate = new Date().toLocaleDateString('zh-CN').replace(/\//g, '.');
  console.log('[init] BASE =', BASE);
}

// ============ 渲染模板列表 ============
function renderTemplates(){
  const list = document.getElementById('templateList');
  list.innerHTML = '';
  TEMPLATES.forEach((t, idx) => {
    const div = document.createElement('div');
    div.className = 'template-item' + (idx === 0 ? ' active' : '');
    div.innerHTML = `<img src="${t.file}" alt="${t.name}" loading="lazy" onerror="showError('缩略图加载失败: ${t.file}')"><span>${t.name}</span>`;
    div.onclick = () => {
      document.querySelectorAll('.template-item').forEach(c => c.classList.remove('active'));
      div.classList.add('active');
      selectTemplate(t);
    };
    list.appendChild(div);
  });
}

// ============ 选择模板 ============
function selectTemplate(t){
  currentTemplate = t;
  bgImage = new Image();
  bgImage.crossOrigin = 'anonymous';
  bgImage.onload = () => {
    resetBoxes();
    redraw();
  };
  bgImage.onerror = () => {
    showError('图片加载失败: ' + t.file + ' (BASE=' + BASE + ')');
    console.error('Image failed:', t.file, '| Try URL:', window.location.origin + BASE + 'images/' + t.file.split('/').pop());
  };
  bgImage.src = t.file;
}

// ============ 重置文本框位置 ============
function resetBoxes(){
  const tpl = currentTemplate;
  if(!tpl) return;
  // 正文框：上半部分安全区域
  const margin = 80;
  let safeBottom = tpl.height * 0.55; // 占上半部分
  if(tpl.avoidArea) safeBottom = Math.min(safeBottom, tpl.avoidArea.y - 40);
  textBox = {x: margin, y: margin + 40, w: tpl.width - 2*margin, h: safeBottom - margin - 40};

  // 落款框：右下角，避开 avoidArea
  let sigY = tpl.height - 180;
  if(tpl.avoidArea && tpl.avoidArea.y){
    sigY = Math.min(sigY, tpl.avoidArea.y - 100);
  }
  sigBox = {x: tpl.width - 280, y: sigY, w: 220, h: 72};
}

// ============ 核心绘制 ============
function redraw(){
  if(!currentTemplate || !bgImage) return;

  // 计算缩放和居中
  const scale = Math.min(MAX_W / currentTemplate.width, MAX_H / currentTemplate.height);
  const dispW = currentTemplate.width * scale;
  const dispH = currentTemplate.height * scale;
  const offsetX = (MAX_W - dispW) / 2;
  const offsetY = (MAX_H - dispH) / 2;

  // 设置画布实际像素尺寸
  canvas.width = MAX_W;
  canvas.height = MAX_H;

  // 清空
  ctx.clearRect(0, 0, MAX_W, MAX_H);

  // 绘制背景图（居中等比缩放）
  ctx.drawImage(bgImage, offsetX, offsetY, dispW, dispH);

  if(previewMode){
    // 预览模式：只画文字，不画框
    drawTextOnCanvas(offsetX, offsetY, scale);
    if(document.getElementById('showSignature').checked){
      drawSigOnCanvas(offsetX, offsetY, scale);
    }
    return;
  }

  // 编辑模式：画虚线框 + 手柄 + 文字
  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // 正文框
  ctx.strokeStyle = '#4a90d9';
  ctx.lineWidth = 2 / scale;
  ctx.setLineDash([8/scale, 4/scale]);
  ctx.strokeRect(textBox.x, textBox.y, textBox.w, textBox.h);
  ctx.setLineDash([]);

  // 正文文字
  drawTextContent(ctx, textBox, userTextZh || '点击「编辑文字」输入内容...', false);

  // 落款框
  if(document.getElementById('showSignature').checked){
    ctx.strokeStyle = '#e76f51';
    ctx.lineWidth = 1.5 / scale;
    ctx.setLineDash([6/scale, 4/scale]);
    ctx.strokeRect(sigBox.x, sigBox.y, sigBox.w, sigBox.h);
    ctx.setLineDash([]);

    drawSigContent(ctx, sigBox);
  }

  ctx.restore();

  // 屏幕坐标手柄
  drawHandles(offsetX, offsetY, scale);
}

// ============ 在画布上绘制正文（编辑模式用 ctx 带缩放） ============
function drawTextContent(context, box, text, isOutput){
  const ff = document.getElementById('fontFamily').value;
  const fs = parseInt(document.getElementById('fontSize').value);
  const fc = document.getElementById('fontColor').value;
  const ta = document.getElementById('textAlign').value;
  const lh = parseFloat(document.getElementById('lineHeight').value);
  const fw = document.getElementById('fontWeight').value;

  context.font = `${fw} ${fs}px ${ff}`;
  context.fillStyle = fc;
  context.textAlign = ta;
  context.textBaseline = 'top';

  // 先按 \n 分段，再按宽度折行
  const paragraphs = text.split('\n');
  let allLines = [];
  paragraphs.forEach(para => {
    if(para === ''){
      allLines.push('');
    } else {
      allLines = allLines.concat(wrapText(context, para, box.w - 24));
    }
  });

  const startY = box.y + 12;
  const lineH = fs * lh;

  // 自动缩小字号适配
  let afs = fs;
  let testLines = allLines.slice();
  while(startY + testLines.length * lineH > box.y + box.h - 12 && afs > 10){
    afs--;
    context.font = `${fw} ${afs}px ${ff}`;
    testLines = [];
    paragraphs.forEach(para => {
      if(para === '') testLines.push('');
      else testLines = testLines.concat(wrapText(context, para, box.w - 24));
    });
  }

  // 用确认的字号重绘
  context.font = `${fw} ${afs}px ${ff}`;
  const finalLineH = afs * lh;
  testLines.forEach((line, i) => {
    let x = ta === 'center' ? box.x + box.w/2 : ta === 'right' ? box.x + box.w - 12 : box.x + 12;
    context.fillText(line, x, startY + i * finalLineH);
  });
}

// ============ 在画布上绘制落款 ============
function drawSigContent(context, box){
  const ff = document.getElementById('fontFamily').value;
  const fw = document.getElementById('fontWeight').value;
  const ta = document.getElementById('textAlign').value;

  const sigSel = document.getElementById('sigFontSize').value;
  let sigFs = parseInt(document.getElementById('fontSize').value);
  if(sigSel !== 'same') sigFs = parseInt(sigSel);

  context.font = `${fw} ${sigFs}px ${ff}`;
  context.fillStyle = '#555555';
  context.textAlign = ta;
  context.textBaseline = 'top';

  const lines = [];
  if(userSigText) lines.push(userSigText);
  if(userSigDate) lines.push(userSigDate);

  const startY = box.y + 8;
  const lineH = sigFs * 1.5;

  lines.forEach((line, i) => {
    let x = ta === 'center' ? box.x + box.w/2 : ta === 'right' ? box.x + box.w - 10 : box.x + 10;
    context.fillText(line, x, startY + i * lineH);
  });
}

// ============ 输出模式绘制（不带缩放翻译，直接原始坐标） ============
function drawTextOnCanvas(offsetX, offsetY, scale){
  const ff = document.getElementById('fontFamily').value;
  const fs = parseInt(document.getElementById('fontSize').value);
  const fc = document.getElementById('fontColor').value;
  const ta = document.getElementById('textAlign').value;
  const lh = parseFloat(document.getElementById('lineHeight').value);
  const fw = document.getElementById('fontWeight').value;

  ctx.font = `${fw} ${fs}px ${ff}`;
  ctx.fillStyle = fc;
  ctx.textAlign = ta;
  ctx.textBaseline = 'top';

  const text = userTextZh || '';
  const paragraphs = text.split('\n');
  let allLines = [];
  paragraphs.forEach(para => {
    if(para === '') allLines.push('');
    else allLines = allLines.concat(wrapText(ctx, para, textBox.w - 24));
  });

  const startY = offsetY + textBox.y * scale;
  const lineH = fs * lh * scale;
  let afs = fs;
  while(startY + allLines.length * lineH > offsetY + (textBox.y + textBox.h) * scale && afs > 10){
    afs--;
    ctx.font = `${fw} ${afs}px ${ff}`;
    allLines = [];
    paragraphs.forEach(para => {
      if(para === '') allLines.push('');
      else allLines = allLines.concat(wrapText(ctx, para, textBox.w - 24));
    });
  }
  ctx.font = `${fw} ${afs}px ${ff}`;
  const finalLineH = afs * lh * scale;
  allLines.forEach((line, i) => {
    let x;
    if(ta === 'center') x = offsetX + (textBox.x + textBox.w/2) * scale;
    else if(ta === 'right') x = offsetX + (textBox.x + textBox.w - 12) * scale;
    else x = offsetX + (textBox.x + 12) * scale;
    ctx.fillText(line, x, startY + i * finalLineH);
  });
}

function drawSigOnCanvas(offsetX, offsetY, scale){
  const ff = document.getElementById('fontFamily').value;
  const fw = document.getElementById('fontWeight').value;
  const ta = document.getElementById('textAlign').value;

  const sigSel = document.getElementById('sigFontSize').value;
  let sigFs = parseInt(document.getElementById('fontSize').value);
  if(sigSel !== 'same') sigFs = parseInt(sigSel);

  ctx.font = `${fw} ${sigFs}px ${ff}`;
  ctx.fillStyle = '#555555';
  ctx.textAlign = ta;
  ctx.textBaseline = 'top';

  const lines = [];
  if(userSigText) lines.push(userSigText);
  if(userSigDate) lines.push(userSigDate);

  const startY = offsetY + sigBox.y * scale + 8 * scale;
  const lineH = sigFs * 1.5 * scale;

  lines.forEach((line, i) => {
    let x;
    if(ta === 'center') x = offsetX + (sigBox.x + sigBox.w/2) * scale;
    else if(ta === 'right') x = offsetX + (sigBox.x + sigBox.w - 10) * scale;
    else x = offsetX + (sigBox.x + 10) * scale;
    ctx.fillText(line, x, startY + i * lineH);
  });
}

// ============ 绘制手柄（屏幕坐标） ============
function drawHandles(offsetX, offsetY, scale){
  const drawHandle = (x, y, color) => {
    ctx.beginPath();
    ctx.arc(offsetX + x * scale, offsetY + y * scale, 7, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  };

  // 正文框 4 角
  drawHandle(textBox.x, textBox.y, '#4a90d9');
  drawHandle(textBox.x + textBox.w, textBox.y, '#4a90d9');
  drawHandle(textBox.x, textBox.y + textBox.h, '#4a90d9');
  drawHandle(textBox.x + textBox.w, textBox.y + textBox.h, '#4a90d9');

  // 落款框 4 角
  if(document.getElementById('showSignature').checked){
    drawHandle(sigBox.x, sigBox.y, '#e76f51');
    drawHandle(sigBox.x + sigBox.w, sigBox.y, '#e76f51');
    drawHandle(sigBox.x, sigBox.y + sigBox.h, '#e76f51');
    drawHandle(sigBox.x + sigBox.w, sigBox.y + sigBox.h, '#e76f51');
  }
}

// ============ 文字折行 ============
function wrapText(context, text, maxWidth){
  if(!text) return [''];
  const chars = text.split('');
  const lines = [];
  let cur = '';
  for(let i = 0; i < chars.length; i++){
    const test = cur + chars[i];
    if(context.measureText(test).width > maxWidth && cur !== ''){
      lines.push(cur);
      cur = chars[i];
    } else {
      cur = test;
    }
  }
  if(cur) lines.push(cur);
  return lines;
}

// ============ 鼠标/触摸交互 ============
function setupCanvasEvents(){
  canvas.addEventListener('mousedown', onMouseDown);
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseup', onMouseUp);
  canvas.addEventListener('mouseleave', onMouseUp);
  canvas.addEventListener('touchstart', onTouchStart, {passive:false});
  canvas.addEventListener('touchmove', onTouchMove, {passive:false});
  canvas.addEventListener('touchend', onTouchEnd);
}

function getTransform(){
  const scale = Math.min(MAX_W / currentTemplate.width, MAX_H / currentTemplate.height);
  const offsetX = (MAX_W - currentTemplate.width * scale) / 2;
  const offsetY = (MAX_H - currentTemplate.height * scale) / 2;
  return {scale, offsetX, offsetY};
}

function screenToTemplate(sx, sy){
  const {scale, offsetX, offsetY} = getTransform();
  return {
    x: (sx - offsetX) / scale,
    y: (sy - offsetY) / scale
  };
}

function getHandleAt(tx, ty, box, hitRadius){
  const corners = [
    {x: box.x, y: box.y},
    {x: box.x + box.w, y: box.y},
    {x: box.x, y: box.y + box.h},
    {x: box.x + box.w, y: box.y + box.h}
  ];
  const {scale} = getTransform();
  const r = hitRadius / scale;
  for(const c of corners){
    if(Math.abs(tx - c.x) < r && Math.abs(ty - c.y) < r){
      return c;
    }
  }
  return null;
}

function onMouseDown(e){
  if(previewMode || !currentTemplate) return;
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
  const pt = screenToTemplate(sx, sy);

  // 检查是否点中手柄（先检查落款框，再检查正文框）
  if(document.getElementById('showSignature').checked){
    const sigHandle = getHandleAt(pt.x, pt.y, sigBox, 14);
    if(sigHandle){
      resizeTarget = 'sig';
      dragStartX = pt.x;
      dragStartY = pt.y;
      // 判断是哪个角
      if(sigHandle.x === sigBox.x && sigHandle.y === sigBox.y) resizeCorner = 'nw';
      else if(sigHandle.x === sigBox.x + sigBox.w && sigHandle.y === sigBox.y) resizeCorner = 'ne';
      else if(sigHandle.x === sigBox.x && sigHandle.y === sigBox.y + sigBox.h) resizeCorner = 'sw';
      else resizeCorner = 'se';
      return;
    }
    // 检查是否拖拽落款框
    if(pt.x >= sigBox.x && pt.x <= sigBox.x + sigBox.w && pt.y >= sigBox.y && pt.y <= sigBox.y + sigBox.h){
      dragTarget = 'sig';
      dragOffsetX = pt.x - sigBox.x;
      dragOffsetY = pt.y - sigBox.y;
      canvas.style.cursor = 'grabbing';
      return;
    }
  }

  // 正文框手柄
  const textHandle = getHandleAt(pt.x, pt.y, textBox, 14);
  if(textHandle){
    resizeTarget = 'text';
    dragStartX = pt.x;
    dragStartY = pt.y;
    if(textHandle.x === textBox.x && textHandle.y === textBox.y) resizeCorner = 'nw';
    else if(textHandle.x === textBox.x + textBox.w && textHandle.y === textBox.y) resizeCorner = 'ne';
    else if(textHandle.x === textBox.x && textHandle.y === textBox.y + textBox.h) resizeCorner = 'sw';
    else resizeCorner = 'se';
    return;
  }

  // 拖拽正文框
  if(pt.x >= textBox.x && pt.x <= textBox.x + textBox.w && pt.y >= textBox.y && pt.y <= textBox.y + textBox.h){
    dragTarget = 'text';
    dragOffsetX = pt.x - textBox.x;
    dragOffsetY = pt.y - textBox.y;
    canvas.style.cursor = 'grabbing';
  }
}

function onMouseMove(e){
  if(previewMode || !currentTemplate) return;
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
  const pt = screenToTemplate(sx, sy);

  // 拖拽中
  if(dragTarget === 'text'){
    textBox.x = pt.x - dragOffsetX;
    textBox.y = pt.y - dragOffsetY;
    clampBox(textBox, currentTemplate);
    redraw();
    return;
  }
  if(dragTarget === 'sig'){
    sigBox.x = pt.x - dragOffsetX;
    sigBox.y = pt.y - dragOffsetY;
    clampBox(sigBox, currentTemplate);
    redraw();
    return;
  }

  // 缩放中
  if(resizeTarget && dragStartX !== undefined){
    const dx = pt.x - dragStartX;
    const dy = pt.y - dragStartY;
    const box = resizeTarget === 'text' ? textBox : sigBox;
    let n = {...box};
    switch(resizeCorner){
      case 'nw': n.x += dx; n.y += dy; n.w -= dx; n.h -= dy; break;
      case 'ne': n.y += dy; n.w += dx; n.h -= dy; break;
      case 'sw': n.x += dx; n.w -= dx; n.h += dy; break;
      case 'se': n.w += dx; n.h += dy; break;
    }
    if(n.w > 60 && n.h > 30){
      Object.assign(box, n);
      dragStartX = pt.x;
      dragStartY = pt.y;
      clampBox(box, currentTemplate);
      redraw();
    }
    return;
  }

  // 悬停光标
  const handle = getHandleAt(pt.x, pt.y, textBox, 14) || (document.getElementById('showSignature').checked' ? getHandleAt(pt.x, pt.y, sigBox, 14) : null);
  if(handle){
    canvas.style.cursor = 'nwse-resize';
  } else if((pt.x >= textBox.x && pt.x <= textBox.x + textBox.w && pt.y >= textBox.y && pt.y <= textBox.y + textBox.h) ||
            (document.getElementById('showSignature').checked' && pt.x >= sigBox.x && pt.x <= sigBox.x + sigBox.w && pt.y >= sigBox.y && pt.y <= sigBox.y + sigBox.h)){
    canvas.style.cursor = 'move';
  } else {
    canvas.style.cursor = 'default';
  }
}

function onMouseUp(){
  dragTarget = null;
  resizeTarget = null;
  resizeCorner = '';
  dragStartX = 0;
  dragStartY = 0;
  canvas.style.cursor = 'default';
}

// 触摸事件
function onTouchStart(e){ e.preventDefault(); if(e.touches.length===1) onMouseDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY}); }
function onTouchMove(e){ e.preventDefault(); if(e.touches.length===1) onMouseMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY}); }
function onTouchEnd(e){ e.preventDefault(); onMouseUp(); }

// ============ 限制框在画布内 + 避开图案 ============
function clampBox(box, tpl){
  box.x = Math.max(10, Math.min(box.x, tpl.width - box.w - 10));
  box.y = Math.max(10, Math.min(box.y, tpl.height - box.h - 10));
  box.w = Math.max(80, Math.min(box.w, tpl.width - 20));
  box.h = Math.max(40, Math.min(box.h, tpl.height - 20));
  // 避开 avoidArea
  if(tpl.avoidArea){
    const a = tpl.avoidArea;
    if(box.y + box.h > a.y && box.x < a.x + a.w && box.x + box.w > a.x && box.y < a.y + a.h){
      // 重叠了，把框往上推
      box.y = Math.max(10, a.y - box.h - 20);
    }
  }
}

// ============ 工具栏事件 ============
function setupToolbarEvents(){
  ['fontFamily','fontSize','fontColor','textAlign','lineHeight','fontWeight','sigFontSize'].forEach(id => {
    document.getElementById(id).addEventListener('change', redraw);
    document.getElementById(id).addEventListener('input', redraw);
  });
  document.getElementById('showSignature').addEventListener('change', redraw);
}

// ============ 弹窗逻辑 ============
function openTextEditor(){
  document.getElementById('editTextZh').value = userTextZh || '';
  document.getElementById('editSigText').value = userSigText || '永远爱你的妈妈';
  document.getElementById('editSigDate').value = userSigDate || new Date().toLocaleDateString('zh-CN').replace(/\//g, '.');
  document.getElementById('textModal').classList.add('active');
  setTimeout(() => document.getElementById('editTextZh').focus(), 100);
}

function closeTextEditor(){
  document.getElementById('textModal').classList.remove('active');
}

function confirmText(){
  userTextZh = document.getElementById('editTextZh').value.trim();
  userSigText = document.getElementById('editSigText').value.trim() || '永远爱你的妈妈';
  userSigDate = document.getElementById('editSigDate').value.trim() || new Date().toLocaleDateString('zh-CN').replace(/\//g, '.');
  closeTextEditor();
  redraw();
  showToast('✅ 文字已更新');
}

// ============ 预览模式 ============
function togglePreview(){
  previewMode = !previewMode;
  const bar = document.getElementById('previewBar');
  if(previewMode) bar.classList.add('active');
  else bar.classList.remove('active');
  showToast(previewMode ? '👁 预览模式 — 文字已锁定' : '✏️ 已退出预览');
  redraw();
}

function exitPreview(){
  previewMode = false;
  document.getElementById('previewBar').classList.remove('active');
  redraw();
}

// ============ 生成图片（高清输出） ============
function generateImage(){
  if(!currentTemplate || !bgImage) return;

  const out = document.createElement('canvas');
  out.width = currentTemplate.width;
  out.height = currentTemplate.height;
  const octx = out.getContext('2d');

  // 画背景
  octx.drawImage(bgImage, 0, 0);

  // 画正文
  const ff = document.getElementById('fontFamily').value;
  const fs = parseInt(document.getElementById('fontSize').value);
  const fc = document.getElementById('fontColor').value;
  const ta = document.getElementById('textAlign').value;
  const lh = parseFloat(document.getElementById('lineHeight').value);
  const fw = document.getElementById('fontWeight').value;

  octx.font = `${fw} ${fs}px ${ff}`;
  octx.fillStyle = fc;
  octx.textAlign = ta;
  octx.textBaseline = 'top';

  const text = userTextZh || '';
  const paragraphs = text.split('\n');
  let allLines = [];
  paragraphs.forEach(para => {
    if(para === '') allLines.push('');
    else allLines = allLines.concat(wrapText(octx, para, textBox.w - 24));
  });

  const startY = textBox.y + 12;
  const lineH = fs * lh;
  let afs = fs;
  let testLines = allLines.slice();
  while(startY + testLines.length * lineH > textBox.y + textBox.h - 12 && afs > 10){
    afs--;
    octx.font = `${fw} ${afs}px ${ff}`;
    testLines = [];
    paragraphs.forEach(para => {
      if(para === '') testLines.push('');
      else testLines = testLines.concat(wrapText(octx, para, textBox.w - 24));
    });
  }
  octx.font = `${fw} ${afs}px ${ff}`;
  const finalLineH = afs * lh;
  testLines.forEach((line, i) => {
    let x = ta === 'center' ? textBox.x + textBox.w/2 : ta === 'right' ? textBox.x + textBox.w - 12 : textBox.x + 12;
    octx.fillText(line, x, startY + i * finalLineH);
  });

  // 画落款
  if(document.getElementById('showSignature').checked){
    const sigSel = document.getElementById('sigFontSize').value;
    let sigFs = fs;
    if(sigSel !== 'same') sigFs = parseInt(sigSel);

    octx.font = `${fw} ${sigFs}px ${ff}`;
    octx.fillStyle = '#555555';
    octx.textAlign = ta;
    octx.textBaseline = 'top';

    const lines = [];
    if(userSigText) lines.push(userSigText);
    if(userSigDate) lines.push(userSigDate);

    const sigStartY = sigBox.y + 8;
    const sigLineH = sigFs * 1.5;
    lines.forEach((line, i) => {
      let x = ta === 'center' ? sigBox.x + sigBox.w/2 : ta === 'right' ? sigBox.x + sigBox.w - 10 : sigBox.x + 10;
      octx.fillText(line, x, sigStartY + i * sigLineH);
    });
  }

  // 下载
  const link = document.createElement('a');
  link.download = `鼓励贴_${currentTemplate.name}_${Date.now()}.png`;
  link.href = out.toDataURL('image/png');
  link.click();
  showToast('✅ 图片已生成并下载！');
}

// ============ Toast ============
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ============ 错误提示 ============
function showError(msg){
  console.error(msg);
  const box = document.getElementById('errorBox');
  box.textContent = '❌ ' + msg;
  box.classList.add('show');
  setTimeout(() => box.classList.remove('show'), 8000);
}

// ============ 键盘快捷键 ============
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(previewMode) exitPreview(); closeTextEditor(); }
  if(e.key === 'p' || e.key === 'P') togglePreview();
  if((e.key === 's' || e.key === 'S') && (e.ctrlKey || e.metaKey)){ e.preventDefault(); generateImage(); }
  if(e.key === 'e' || e.key === 'E') openTextEditor();
});

// ============ 启动 ============
window.addEventListener('DOMContentLoaded', init);
</script>
