<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/courage-card/">
<title>鼓励贴生成器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Microsoft YaHei',sans-serif; background:#f0f2f5; display:flex; height:100vh; overflow:hidden; }

.sidebar { width:220px; background:#fff; border-right:1px solid #e8e8e8; display:flex; flex-direction:column; }
.logo { padding:16px 12px; font-size:16px; font-weight:bold; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; gap:8px; }
.logo svg { width:24px; height:24px; }
.steps { padding:10px 12px; font-size:12px; color:#888; border-bottom:1px solid #f0f0f0; }
.template-list { flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.template-item { border-radius:8px; overflow:hidden; border:2px solid transparent; cursor:pointer; transition:all .2s; }
.template-item img { width:100%; display:block; aspect-ratio:9/16; object-fit:cover; }
.template-item span { display:block; font-size:10px; text-align:center; padding:4px 0; color:#555; }
.template-item:hover { border-color:#4a90d9; }
.template-item.active { border-color:#ff6b6b; box-shadow:0 0 8px rgba(255,107,107,.4); }

.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.toolbar { background:#fff; padding:10px 20px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #e8e8e8; flex-wrap:wrap; }
.toolbar select, .toolbar input[type=color], .toolbar button { padding:6px 10px; border:1px solid #d9d9d9; border-radius:4px; font-size:14px; outline:none; }
.toolbar input[type=color] { width:32px; height:32px; padding:2px; cursor:pointer; }
.toolbar label { font-size:13px; display:flex; align-items:center; gap:4px; cursor:pointer; }
.btn { padding:6px 16px; border-radius:4px; cursor:pointer; font-size:14px; border:none; color:#fff; }
.btn-edit { background:#ff6b6b; }
.btn-preview { background:#fff; border:1px solid #4a90d9; color:#4a90d9; }
.btn-generate { background:#4a90d9; }
.btn-reset { background:#f5f5f5; border:1px solid #d9d9d9; color:#333; }

.canvas-wrap { flex:1; display:flex; align-items:center; justify-content:center; background:#e8e8e8; position:relative; overflow:hidden; }
canvas { cursor:default; box-shadow:0 4px 12px rgba(0,0,0,.1); }

#previewBar { position:fixed; top:0; left:0; right:0; background:#4a90d9; color:#fff; text-align:center; padding:8px; z-index:100; transform:translateY(-100%); transition:transform .3s; }
#previewBar.active { transform:translateY(0); }

#toast { position:fixed; bottom:40px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(0,0,0,.7); color:#fff; padding:10px 24px; border-radius:20px; opacity:0; transition:all .3s; z-index:200; font-size:14px; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:300; }
.modal-overlay.active { display:flex; }
.modal-box { background:#fff; border-radius:12px; padding:24px; width:420px; max-width:90vw; box-shadow:0 8px 24px rgba(0,0,0,.15); }
.modal-title { font-size:18px; font-weight:bold; margin-bottom:16px; }
.modal-group { margin-bottom:14px; }
.modal-group label { display:block; font-size:13px; margin-bottom:6px; color:#333; font-weight:500; }
.modal-group textarea { width:100%; padding:10px; border:1px solid #d9d9d9; border-radius:6px; font-size:14px; resize:vertical; min-height:80px; font-family:inherit; line-height:1.6; }
.modal-group input[type=text] { width:100%; padding:10px; border:1px solid #d9d9d9; border-radius:6px; font-size:14px; }
.modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
.btn-cancel { padding:8px 20px; border:1px solid #d9d9d9; background:#fff; border-radius:6px; cursor:pointer; font-size:14px; }
.btn-confirm { padding:8px 20px; background:#4a90d9; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
.hint-text { font-size:12px; color:#888; margin-top:4px; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-5-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    鼓励贴生成器
  </div>
  <div class="steps">选择模板 → 编辑文字 → 一键生成</div>
  <div class="template-list" id="templateList"></div>
</div>

<div class="main">
  <div class="toolbar">
    <select id="fontFamily">
      <option value="Microsoft YaHei">微软雅黑</option>
      <option value="SimSun">宋体</option>
      <option value="KaiTi">楷体</option>
      <option value="Arial">Arial</option>
      <option value="Georgia">Georgia</option>
      <option value="仓耳舒圆">仓耳舒圆</option>
    </select>
    <select id="fontSize"></select>
    <input type="color" id="fontColor" value="#000000">
    <select id="textAlign">
      <option value="left" selected>左对齐</option>
      <option value="center">居中</option>
      <option value="right">右对齐</option>
    </select>
    <select id="lineHeight">
      <option value="1.4">1.4</option>
      <option value="1.5">1.5</option>
      <option value="1.55" selected>1.55</option>
      <option value="1.6">1.6</option>
      <option value="1.8">1.8</option>
      <option value="2.0">2.0</option>
    </select>
    <select id="fontWeight">
      <option value="normal">普通</option>
      <option value="bold">加粗</option>
    </select>
    <label><input type="checkbox" id="showSignature" checked> 落款</label>
    <select id="sigFontSize"></select>
    <label><input type="checkbox" id="autoFit"> 自动适配框</label>
    <button class="btn btn-edit" onclick="openTextEditor()">✏️ 编辑文字</button>
    <button class="btn btn-preview" onclick="togglePreview()">👁 预览</button>
    <button class="btn btn-generate" onclick="generateImage()">💾 生成图片</button>
    <button class="btn btn-reset" onclick="resetBoxes()">重置位置</button>
  </div>
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="canvas"></canvas>
  </div>
  <div id="previewBar">👁 预览模式 — 文字已锁定（按 P 或 Esc 退出）</div>
</div>

<div class="modal-overlay" id="textModal">
  <div class="modal-box">
    <div class="modal-title">✏️ 编辑文字内容</div>
    <div class="modal-group">
      <label for="editTextZh">📝 正文内容（支持按回车换行）</label>
      <textarea id="editTextZh"></textarea>
      <div class="hint-text">💡 提示：在输入框中按回车键即可实现换行。</div>
    </div>
    <div class="modal-group">
      <label for="editSigText">✍️ 落款文字</label>
      <input type="text" id="editSigText">
    </div>
    <div class="modal-group">
      <label for="editSigDate">📅 落款日期</label>
      <input type="text" id="editSigDate">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeTextEditor()">取消</button>
      <button class="btn-confirm" onclick="confirmText()">确认</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ============ 全局状态 ============
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
let currentTemplate = null;
let bgImage = null;
let previewMode = false;
let textBox = { x:0, y:0, w:0, h:0 };
let sigBox = { x:0, y:0, w:0, h:0 };
let userTextZh = '加油，你会闪闪发光。\n每一步都算数，每一个小小的坚持，都在把未来点亮。';
let userSigText = '永远爱你的妈妈';
let userSigDate = new Date().toLocaleDateString('zh-CN').replace(/\//g, '.');
let dragTarget = null;
let dragAction = null; // 'move' | 'resize'
let dragOffset = { x:0, y:0 };
let dragOrig = { w:0, h:0 };

// ============ 模板数据（恢复你原来的24张） ============
const templates = [
  { id:"01", name:"绿色星空小巫师", file:"images/01_wizard_green.png", width:562, height:1000 },
  { id:"02", name:"暖黄魔法小巫师", file:"images/02_wizard_yellow.png", width:562, height:1000 },
  { id:"03", name:"粉色樱花小巫师", file:"images/03_wizard_pink.png", width:562, height:1000 },
  { id:"04", name:"蓝天雨滴小巫师", file:"images/04_wizard_blue.png", width:562, height:1000 },
  { id:"05", name:"暖橙阳光小巫师", file:"images/05_wizard_orange.png", width:562, height:1000 },
  { id:"06", name:"梦幻紫色小巫师", file:"images/06_wizard_purple.png", width:562, height:1000 },
  { id:"07", name:"薄荷绿叶小巫师", file:"images/07_wizard_mint.png", width:562, height:1000 },
  { id:"08", name:"冰雪蓝星小巫师", file:"images/08_wizard_ice.png", width:562, height:1000 },
  { id:"09", name:"黄昏晚霞小巫师", file:"images/09_wizard_sunset.png", width:562, height:1000 },
  { id:"10", name:"海洋波浪小巫师", file:"images/10_wizard_ocean.png", width:562, height:1000 },
  { id:"11", name:"薰衣草紫小巫师", file:"images/11_wizard_lavender.png", width:562, height:1000 },
  { id:"12", name:"糖果彩虹小巫师", file:"images/12_wizard_rainbow.png", width:562, height:1000 },
  { id:"13", name:"森林绿野小巫师", file:"images/13_wizard_forest.png", width:562, height:1000 },
  { id:"14", name:"柠檬微风小巫师", file:"images/14_wizard_lemon.png", width:562, height:1000 },
  { id:"15", name:"玫瑰花园小巫师", file:"images/15_wizard_rose.png", width:562, height:1000 },
  { id:"16", name:"星空银河小巫师", file:"images/16_wizard_galaxy.png", width:562, height:1000 },
  { id:"17", name:"云朵棉花糖小巫师", file:"images/17_wizard_cloud.png", width:562, height:1000 },
  { id:"18", name:"枫叶秋天小巫师", file:"images/18_wizard_maple.png", width:562, height:1000 },
  { id:"19", name:"糖果条纹小巫师", file:"images/19_wizard_stripe.png", width:562, height:1000 },
  { id:"20", name:"极光幻境小巫师", file:"images/20_wizard_aurora.png", width:562, height:1000 },
  { id:"21", name:"巧克力甜心小巫师", file:"images/21_wizard_choco.png", width:562, height:1000 },
  { id:"22", name:"青柠苏打小巫师", file:"images/22_wizard_lime.png", width:562, height:1000 },
  { id:"23", name:"蜜桃气泡小巫师", file:"images/23_wizard_peach.png", width:562, height:1000 },
  { id:"24", name:"夜空流星小巫师", file:"images/24_wizard_meteor.png", width:562, height:1000 }
];

// ============ 字号下拉填充（25~65） ============
(function fillFontSize(){
  const sel = document.getElementById('fontSize');
  for(let i=25;i<=65;i++){
    const o=document.createElement('option');
    o.value=i; o.text=i+'px';
    if(i===45) o.selected=true;
    sel.appendChild(o);
  }
})();
(function fillSigSize(){
  const sel = document.getElementById('sigFontSize');
  const same=document.createElement('option');
  same.value='same'; same.text='同正文'; same.selected=true;
  sel.appendChild(same);
  for(let i=20;i<=50;i+=2){
    const o=document.createElement('option');
    o.value=i; o.text=i+'px';
    if(i===28) o.selected=true;
    sel.appendChild(o);
  }
})();

// ============ 初始化 ============
function init(){
  renderTemplates();
  selectTemplate(templates[0]);
  document.getElementById('editSigDate').value = userSigDate;
  document.getElementById('fontSize').value = '45';
  document.getElementById('textAlign').value = 'left';
  document.getElementById('lineHeight').value = '1.55';
}

function renderTemplates(){
  const list = document.getElementById('templateList');
  templates.forEach(t => {
    const div = document.createElement('div');
    div.className = 'template-item';
    div.innerHTML = `<img src="${t.file}" loading="lazy" alt="${t.name}"><span>${t.name}</span>`;
    div.onclick = () => selectTemplate(t, div);
    list.appendChild(div);
  });
}

function selectTemplate(t, el){
  currentTemplate = t;
  document.querySelectorAll('.template-item').forEach(e => e.classList.remove('active'));
  if(el) el.classList.add('active');
  bgImage = new Image();
  bgImage.onload = () => {
    resizeCanvas();
    resetBoxes();
    redraw();
  };
  bgImage.src = t.file;
}

function resizeCanvas(){
  if(!bgImage) return;
  canvas.width = currentTemplate.width;
  canvas.height = currentTemplate.height;
}

function resetBoxes(){
  const W = canvas.width, H = canvas.height;
  textBox = {
    x: Math.round(W * 0.18),
    y: Math.round(H * 0.20),
    w: Math.round(W * 0.62),
    h: Math.round(H * 0.40)
  };
  sigBox = {
    x: Math.round(W * 0.345),
    y: Math.round(H * 0.695),
    w: Math.round(W * 0.22),
    h: Math.round(H * 0.06)
  };
}

// ============ 绘制（编辑和导出共用） ============
function drawAll(targetCtx, forExport){
  const W = canvas.width, H = canvas.height;
  targetCtx.clearRect(0,0,W,H);
  if(bgImage) targetCtx.drawImage(bgImage, 0, 0, W, H);

  const ff = document.getElementById('fontFamily').value;
  const fs = parseInt(document.getElementById('fontSize').value);
  const fc = document.getElementById('fontColor').value;
  const ta = document.getElementById('textAlign').value;
  const lh = parseFloat(document.getElementById('lineHeight').value);
  const fw = document.getElementById('fontWeight').value;
  const autoFit = document.getElementById('autoFit').checked;

  // 自动适配：根据框大小算字号
  let bodyFs = fs;
  if(autoFit && userTextZh){
    bodyFs = calcFitFontSize(targetCtx, userTextZh, textBox, ff, fw, lh, fs);
  }

  targetCtx.font = `${fw} ${bodyFs}px ${ff}`;
  targetCtx.fillStyle = fc;
  targetCtx.textAlign = ta;
  targetCtx.textBaseline = 'top';

  const padX = 16;
  const maxW = textBox.w - padX * 2;
  const lines = wrapText(targetCtx, userTextZh || '点击上方"编辑文字"输入内容...', maxW);
  const lineH = bodyFs * lh;
  const startY = textBox.y + 10;

  lines.forEach((line, i) => {
    let x = ta === 'center' ? textBox.x + textBox.w/2 : ta === 'right' ? textBox.x + textBox.w - padX : textBox.x + padX;
    targetCtx.fillText(line, x, startY + i * lineH);
  });

  // 落款
  if(document.getElementById('showSignature').checked){
    const sigSel = document.getElementById('sigFontSize').value;
    let sigFs = bodyFs;
    if(sigSel !== 'same') sigFs = parseInt(sigSel);
    targetCtx.font = `${fw} ${sigFs}px ${ff}`;
    targetCtx.fillStyle = '#666';
    targetCtx.textAlign = ta;
    targetCtx.textBaseline = 'top';
    const sigLines = [];
    if(userSigText) sigLines.push(userSigText);
    if(userSigDate) sigLines.push(userSigDate);
    const sy = sigBox.y + 8;
    const slh = sigFs * 1.5;
    sigLines.forEach((line, i) => {
      let x = ta === 'center' ? sigBox.x + sigBox.w/2 : ta === 'right' ? sigBox.x + sigBox.w - padX : sigBox.x + padX;
      targetCtx.fillText(line, x, sy + i * slh);
    });
  }

  // 编辑态：画框和手柄
  if(!forExport && !previewMode){
    drawBox(targetCtx, textBox, '#4a90d9');
    if(document.getElementById('showSignature').checked) drawBox(targetCtx, sigBox, '#e76f51');
  }
}

function calcFitFontSize(c, text, box, ff, fw, lh, maxFs){
  const padX = 16, padY = 20;
  const maxW = box.w - padX * 2;
  const maxH = box.h - padY;
  if(maxW <= 0 || maxH <= 0) return maxFs;
  let lo = 20, hi = maxFs, best = 28;
  while(lo <= hi){
    const mid = Math.round((lo+hi)/2);
    c.font = `${fw} ${mid}px ${ff}`;
    const lines = wrapText(c, text, maxW);
    const needH = lines.length * mid * lh;
    let okW = true;
    for(const ln of lines){ if(c.measureText(ln).width > maxW){ okW=false; break; } }
    if(okW && needH <= maxH){ best=mid; lo=mid+1; }
    else hi=mid-1;
  }
  return best;
}

function drawBox(c, box, color){
  c.save();
  c.strokeStyle = color; c.lineWidth = 2; c.setLineDash([8,4]);
  c.strokeRect(box.x, box.y, box.w, box.h);
  c.setLineDash([]);
  // 右下角缩放手柄
  c.fillStyle = color;
  c.beginPath(); c.arc(box.x+box.w, box.y+box.h, 8, 0, Math.PI*2); c.fill();
  c.restore();
}

function wrapText(c, text, maxW){
  if(!text) return [];
  const lines = [];
  const paragraphs = text.split('\n');
  for(const para of paragraphs){
    if(!para){ lines.push(''); continue; }
    let cur = '';
    for(const ch of para){
      const test = cur + ch;
      if(c.measureText(test).width > maxW && cur){ lines.push(cur); cur=ch; }
      else cur=test;
    }
    lines.push(cur);
  }
  return lines;
}

function redraw(){ drawAll(ctx, false); }

// ============ 拖拽 ============
canvas.addEventListener('mousedown', e => {
  if(previewMode) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  // 检查是否点中右下角手柄（半径12内）
  const handleR = 14;
  if(Math.hypot(mx - (textBox.x+textBox.w), my - (textBox.y+textBox.h)) <= handleR){
    dragTarget = textBox; dragAction = 'resize'; dragOrig = { w:textBox.w, h:textBox.h };
    dragOffset = { x:mx - (textBox.x+textBox.w), y:my - (textBox.y+textBox.h) };
    return;
  }
  if(Math.hypot(mx - (sigBox.x+sigBox.w), my - (sigBox.y+sigBox.h)) <= handleR){
    dragTarget = sigBox; dragAction = 'resize'; dragOrig = { w:sigBox.w, h:sigBox.h };
    dragOffset = { x:mx - (sigBox.x+sigBox.w), y:my - (sigBox.y+sigBox.h) };
    return;
  }
  // 移动
  if(mx >= textBox.x && mx <= textBox.x+textBox.w && my >= textBox.y && my <= textBox.y+textBox.h){
    dragTarget = textBox; dragAction = 'move';
    dragOffset = { x:mx-textBox.x, y:my-textBox.y };
  } else if(mx >= sigBox.x && mx <= sigBox.x+sigBox.w && my >= sigBox.y && my <= sigBox.y+sigBox.h){
    dragTarget = sigBox; dragAction = 'move';
    dragOffset = { x:mx-sigBox.x, y:my-sigBox.y };
  }
});

canvas.addEventListener('mousemove', e => {
  if(!dragTarget) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  if(dragAction === 'move'){
    dragTarget.x = mx - dragOffset.x;
    dragTarget.y = my - dragOffset.y;
  } else if(dragAction === 'resize'){
    dragTarget.w = Math.max(80, mx - dragTarget.x);
    dragTarget.h = Math.max(40, my - dragTarget.y);
  }
  redraw();
});

canvas.addEventListener('mouseup', () => { dragTarget = null; dragAction = null; });
canvas.addEventListener('mouseleave', () => { dragTarget = null; dragAction = null; });

// ============ 弹窗 ============
function openTextEditor(){
  document.getElementById('editTextZh').value = userTextZh;
  document.getElementById('editSigText').value = userSigText;
  document.getElementById('editSigDate').value = userSigDate;
  document.getElementById('textModal').classList.add('active');
  setTimeout(() => document.getElementById('editTextZh').focus(), 100);
}
function closeTextEditor(){ document.getElementById('textModal').classList.remove('active'); }
function confirmText(){
  userTextZh = document.getElementById('editTextZh').value;
  userSigText = document.getElementById('editSigText').value;
  userSigDate = document.getElementById('editSigDate').value;
  closeTextEditor(); redraw();
  showToast('✅ 文字已更新');
}

// ============ 生成图片 ============
function generateImage(){
  if(!bgImage) return;
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const octx = out.getContext('2d');
  drawAll(octx, true);
  const link = document.createElement('a');
  link.download = `鼓励贴_${currentTemplate.name}_${Date.now()}.png`;
  link.href = out.toDataURL('image/png');
  link.click();
  showToast('✅ 图片已生成并下载！');
}

function togglePreview(){
  previewMode = !previewMode;
  document.getElementById('previewBar').classList.toggle('active', previewMode);
  redraw();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' || e.key === 'p' || e.key === 'P'){ previewMode = false; document.getElementById('previewBar').classList.remove('active'); redraw(); }
});

init();
</script>
</body>
</html>
